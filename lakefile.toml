name = "arlibCommunity"
version = "0.1.0"
defaultTargets = ["ArlibCommunity"]
testDriver = "ArlibCommunityTest"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false

# The community library tracks the matching core branch of Arlib. Using a Git
# dependency keeps fresh GitHub and CI checkouts self-contained.
[[require]]
name = "arlib"
git = "https://github.com/uddaloksarkar/arlib.git"
rev = "arlib-core"

[[lean_lib]]
name = "ArlibCommunity"

[[lean_lib]]
name = "ArlibCommunityTest"
