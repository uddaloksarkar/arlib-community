name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Fetch prebuilt Mathlib
        run: lake exe cache get

      - name: Build the library
        run: lake build

      - name: Reject any use of sorry, and any axiom beyond Mathlib's three
        run: lake env lean scripts/AxiomAudit.lean

      - name: Build and run the smoke tests
        run: lake test

  docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Fetch prebuilt Mathlib
        run: lake exe cache get

      - name: Add doc-gen4 for this job only
        run: |
          cat >> lakefile.toml <<'TOML'

          [[require]]
          name = "doc-gen4"
          scope = "leanprover"
          git = "https://github.com/leanprover/doc-gen4"
          rev = "v4.33.0"
          TOML
          lake update doc-gen4

      - name: Generate API documentation
        run: lake build ArlibCommunity:docs

      - name: Upload the generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: .lake/build/doc
          retention-days: 14
